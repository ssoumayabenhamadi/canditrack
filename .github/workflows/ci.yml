name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (tests Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lancer les tests Pest
        run: php artisan test

  frontend:
    name: Front-end (lint, build, tests Cypress)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérifier la qualité du code (ESLint)
        run: npm run lint

      - name: Compiler le projet (TypeScript + Vite)
        run: npm run build

      - name: Lancer les tests Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          install: false
          # On force l'adresse IPv4 pour que Vite, l'attente et Cypress utilisent la même
          start: npm run dev -- --host 127.0.0.1 --port 5173 --strictPort
          wait-on: 'http://127.0.0.1:5173'
          wait-on-timeout: 120
          config: baseUrl=http://127.0.0.1:5173

      - name: Garder les captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots